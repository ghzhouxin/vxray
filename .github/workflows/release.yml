name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: web/package-lock.json

      - name: Build Backend
        run: |
          cd server
          go build -o vxray ./cmd

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Create Archive
        run: |
          mkdir -p dist/web
          cp server/vxray dist/
          cp -r web/dist/* dist/web/
          tar -czvf vxray-${{ matrix.target }}.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vxray-${{ matrix.target }}
          path: vxray-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/vxray-*.tar.gz
          generate_release_notes: true

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout vxray (for templates)
        uses: actions/checkout@v4
        with:
          path: vxray

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA=$(sha256sum artifacts/vxray-darwin-arm64/vxray-darwin-arm64.tar.gz | cut -d' ' -f1)
          if [ -z "${SHA}" ]; then
            echo "ERROR: SHA256 is empty" >&2
            exit 1
          fi
          echo "darwin_arm64_sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-vxray
        uses: actions/checkout@v4
        with:
          repository: ghzhouxin/homebrew-vxray
          token: ${{ secrets.REPO_TOKEN }}
          path: homebrew-vxray
          fetch-depth: 0

      - name: Render and commit formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SHA="${{ steps.sha256.outputs.darwin_arm64_sha }}"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: VERSION is empty (not a tag trigger)" >&2
            exit 1
          fi

          cd homebrew-vxray

          # Render templates
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{SHA256_DARWIN_ARM64}}|${SHA}|g" \
              ../vxray/.github/homebrew/vxray.rb.tmpl > vxray.rb

          sed -e "s|{{VERSION}}|${VERSION}|g" \
              ../vxray/.github/homebrew/README.md.tmpl > README.md

          # Fail if any placeholder remains unrendered
          if grep -q '{{' vxray.rb README.md; then
            echo "ERROR: unrendered placeholders remain" >&2
            grep -n '{{' vxray.rb README.md >&2 || true
            exit 1
          fi

          # Create orphan branch with single commit, force-push to main
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout --orphan tmp
          git add -A
          git commit -m "chore: update formula for v${VERSION}"
          git branch -M main
          git push --force origin main
